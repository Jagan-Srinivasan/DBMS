<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Management System - Data Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            margin-top: 30px;
        }
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-label {
            font-weight: 600;
            color: #333;
        }
        .btn-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .nav-links {
            margin-top: 20px;
            text-align: center;
        }
        .nav-links a {
            margin: 0 10px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="page-header">
                <h1><i class="bi bi-calculator"></i> Payroll Management System</h1>
                <p class="mb-0">Employee Data Entry Form</p>
            </div>

            <form action="/submit" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="emp_name" class="form-label">Employee Name</label>
                        <input type="text" class="form-control" id="emp_name" name="emp_name" required 
                               placeholder="Enter full name">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="dept_name" class="form-label">Department</label>
                        <input type="text" class="form-control" id="dept_name" name="dept_name" required 
                               placeholder="e.g., Engineering, HR, Finance">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="basic_pay" class="form-label">Basic Pay (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="basic_pay" 
                               name="basic_pay" required placeholder="50000">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="allowance" class="form-label">Allowance (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="allowance" 
                               name="allowance" required placeholder="10000">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="deduction" class="form-label">Deduction (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="deduction" 
                               name="deduction" required placeholder="5000">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="work_hours" class="form-label">Work Hours (Monthly)</label>
                        <input type="number" step="0.01" class="form-control" id="work_hours" 
                               name="work_hours" required placeholder="160">
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-custom btn-lg text-white">
                        Submit Payroll Data
                    </button>
                </div>
            </form>

            <div class="nav-links">
                <a href="/database-tables">💾 Database Tables</a> |
                <a href="/normalized">📊 Normalization Process</a> | 
                <a href="/report">📋 Payroll Report</a> | 
                <a href="/simulate-concurrency">⚙️ Concurrency</a> |
                <a href="/distributed-demo">🌐 Distributed Data</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
